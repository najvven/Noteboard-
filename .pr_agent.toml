[github_app]
pr_commands = ["/agentic_describe", "/agentic_review"]

[review_agent]
issues_user_guidelines = """
Read docs/REVIEW_REQUIREMENTS.md as the accepted product specification. Find
reproducible correctness, state, data integrity, interaction and native isolation
defects. Preserve the established UI design. Check Text scaling, rich-text ranges,
Web viewport/device/session behavior, Section clipping and persistence together.
The files in build/web-filters are vendored generated filter data; focus review on
the application integration in shared/, main.js, preload.cjs and src/ instead.
"""
