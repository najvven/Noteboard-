name: SonarCloud PR analysis

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  sonarcloud:
    name: SonarCloud
    # GitHub does not expose SONAR_TOKEN to fork PRs; skip those securely.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Analyze pull request
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=najvven
            -Dsonar.projectKey=najvven_Noteboard
            -Dsonar.sources=src,shared,main.js,preload.cjs,web-privacy-preload.cjs,server.ts,scripts/web-adblock-extension
            -Dsonar.exclusions=**/node_modules/**,**/dist/**,**/release/**,**/coverage/**,**/.tmp/**,**/data/**,**/graphify-out/**
